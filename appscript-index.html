<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expense Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f0f7f0;--panel:#fff;--ink:#162a19;--muted:#4d7a53;--line:#c4dcc6;--accent:#15803d;--accent-soft:#dcfce7;--pos:#15803d;--neg:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#8faa8f;min-height:100%;padding:0;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#8faa8f;color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased;padding:0;margin:0}.container{max-width:1280px;margin:0 auto;background:var(--bg);box-shadow:0 4px 32px rgba(0,0,0,.25);overflow-x:hidden}
.topnav{display:flex;align-items:center;padding:0 20px;height:52px;background:#14532d;border-bottom:none;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(20,83,45,.35)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;flex:none;color:#fff}
.brand .dot{display:none}
.nav{display:flex;flex:1;margin-left:16px;gap:0}
.nav a{padding:0 13px;height:52px;display:flex;align-items:center;font-weight:600;color:rgba(255,255,255,0.7);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;text-decoration:none}
.nav a.active,.nav a:hover{color:#fff;border-bottom-color:#fff}
.nav-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.sync-btn{display:flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.sync-btn:disabled{opacity:.5;cursor:not-allowed}
.sync-spin{display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#sync-status{font-size:11px;color:rgba(255,255,255,0.8)}
.sheet-link{font-size:11px;color:rgba(255,255,255,0.8);text-decoration:none;padding:5px 9px;border:1px solid rgba(255,255,255,0.3);border-radius:6px}
.sheet-link:hover{color:#fff;border-color:#fff}
.main{padding:16px 20px}
.filter-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filter-bar h1{font-size:16px;font-weight:700}
.filter-bar h1 span{color:var(--muted);font-weight:600}
.btn-group{display:flex;gap:2px;background:var(--line);border-radius:9px;padding:2px}
.tgl{border:none;background:transparent;border-radius:7px;padding:5px 10px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.tgl.on{background:var(--panel);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.1)}
select.flt{appearance:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 22px 6px 10px;font-size:12px;color:var(--ink);cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.kpi{background:#14532d !important;border-color:#14532d !important}
.kpi .lbl{color:rgba(255,255,255,0.75);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.kpi .val{font-size:22px;font-weight:700;margin:6px 0 4px;letter-spacing:-.4px;color:#fff}
.kpi .val.pos{color:#86efac}
.kpi .val.neg{color:#fca5a5}
.row2{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-bottom:14px}
.chartbox{position:relative;height:220px}
.donutwrap{display:flex;gap:12px;align-items:center}
.donutbox{position:relative;width:160px;height:160px;flex:none}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut-center small{color:var(--muted);font-size:9px;font-weight:700;text-transform:uppercase}
.donut-center b{font-size:16px;font-weight:700}
.legend{flex:1;display:flex;flex-direction:column;gap:6px;max-height:180px;overflow:auto}
.lrow{display:flex;align-items:center;gap:7px;font-size:11.5px;cursor:pointer;padding:2px 3px;border-radius:5px}
.lrow:hover{background:var(--bg)}
.lrow .sw{width:9px;height:9px;border-radius:2px;flex:none}
.lrow .nm{flex:1;font-weight:600;overflow-wrap:break-word;word-break:break-word;white-space:normal;line-height:1.3}
.lrow .amt{font-weight:700}
.lrow .pct{color:var(--muted);width:30px;text-align:right}
.cat-add-row{display:flex;gap:6px;margin-top:8px}
.cat-add-row input{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:4px 7px;background:var(--panel);color:var(--ink);outline:none;flex:1;min-width:0}
.cat-add-row button{font-size:11px;background:var(--accent);color:#fff;border:none;border-radius:5px;padding:4px 8px;cursor:pointer;font-weight:700}
.acct-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.acct{border:1px solid transparent;border-radius:8px;padding:8px 10px;cursor:pointer;background:var(--bg);transition:border-color .1s}
.acct:hover{border-color:var(--accent)}
.acct.bank-acct{background:#dbeafe !important;border-color:#93c5fd !important}
.acct.bank-acct:hover{border-color:#3b82f6 !important}
.acct.credit-acct{background:#fef2f2 !important;border-color:#fca5a5 !important}
.acct.credit-acct:hover{border-color:#ef4444 !important}
.acct.brokerage-acct{background:#faf5ff !important;border-color:#c4b5fd !important}
.acct.brokerage-acct:hover{border-color:#8b5cf6 !important}
.acct .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.acct .meta{color:var(--muted);font-size:10px;margin:1px 0 4px}
.acct .bal{font-size:13px;font-weight:700}
.acct-group-label{font-size:13px;font-weight:700;color:#fff;background:#14532d;padding:9px 16px;border-radius:8px;margin:20px 0 12px;letter-spacing:.03em;box-shadow:0 2px 6px rgba(20,83,45,.25);cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
.acct-type-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#14532d;padding:10px 2px 6px;margin-top:10px;border-top:2px solid var(--line)}
.ledger-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
input[type=date]{border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:12px;color:var(--ink);outline:none;background:var(--panel)}
input[type=search]{border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:12px;color:var(--ink);outline:none;background:var(--panel);width:180px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--muted);font-weight:700;font-size:10.5px;text-transform:uppercase;padding:8px 9px;border-bottom:1px solid var(--line)}th[onclick]:hover{color:var(--accent);background:var(--accent-soft)}
td{padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.tag{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:2px 8px;font-size:11px;font-weight:600}
.amt-pos{color:var(--pos);font-weight:700}
.amt-neg{color:var(--neg);font-weight:700}
.right{text-align:right}
.edit-hint{font-size:10px;opacity:.35;cursor:pointer;margin-left:3px}
.edit-hint:hover{opacity:1;color:var(--accent)}
.cat-select{font-size:12px;border:1px solid var(--accent);border-radius:5px;padding:2px 4px;background:var(--panel);color:var(--ink);outline:none}
#overview,#accounts{display:none}
#overview.active,#accounts.active{display:block}
#loading{text-align:center;padding:48px;color:var(--muted)}
.pager{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)}
.pager button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:11px}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.date-range-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;border:1px solid var(--line)}
.date-range-row label{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.date-range-row input[type=date]{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px;color:var(--ink);outline:none;background:var(--panel)}
.date-range-row .clear-btn{font-size:11px;color:var(--neg);background:none;border:none;cursor:pointer;font-weight:700;padding:2px 6px}
.tgl.range-active{background:var(--accent);color:#fff !important;box-shadow:0 1px 3px rgba(0,0,0,.2)}
</style>

function lbl(nm){return ACCT_LABELS[nm]||nm;}

function usdAbs(n){return'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function usdK(n){return Math.abs(n)>=1000?'$'+(Math.abs(n)/1000).toFixed(1)+'k':usdAbs(n);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function filtered(){
  var cutoff=null;
  if(STATE.customStart||STATE.customEnd){
    // Custom range overrides period
    return ALL.filter(function(r){
      if(STATE.account&&r.account!==STATE.account)return false;
      if(STATE.customStart&&r.date<STATE.customStart)return false;
      if(STATE.customEnd&&r.date>STATE.customEnd)return false;
      if(STATE.catFilter&&r.category!==STATE.catFilter)return false;
      return true;
    });
  }
  if(STATE.period>0){cutoff=new Date();cutoff.setDate(cutoff.getDate()-STATE.period);}
  return ALL.filter(function(r){
    if(STATE.account&&r.account!==STATE.account)return false;
    if(cutoff&&r.date<cutoff.toISOString().slice(0,10))return false;
    if(STATE.catFilter&&r.category!==STATE.catFilter)return false;
    return true;
  });
}

function toggleRangePicker(btn){
  var row=document.getElementById('date-range-row');
  var showing=row.style.display!=='none';
  if(showing){clearCustomRange();return;}
  row.style.display='flex';
  btn.classList.add('range-active');
  // Remove 'on' from period buttons
  document.querySelectorAll('#period-btns .tgl:not(#range-btn)').forEach(function(b){b.classList.remove('on');});
}

function applyCustomRange(){
  STATE.customStart=document.getElementById('range-start').value||'';
  STATE.customEnd=document.getElementById('range-end').value||'';
  STATE.page=1;
  render();
}

function clearCustomRange(){
  STATE.customStart='';STATE.customEnd='';
  document.getElementById('range-start').value='';
  document.getElementById('range-end').value='';
  document.getElementById('date-range-row').style.display='none';
  document.getElementById('range-btn').classList.remove('range-active');
  STATE.page=1;render();
}

function render(){var rows=filtered();renderKPIs(rows);renderBar(rows);renderDonut(rows);renderAccounts();renderTx();}
function renderKPIs(rows){
  var spent=0,income=0;
  rows.forEach(function(r){if(r.amount<0)spent+=r.amount;else income+=r.amount;});
  var net=income+spent;
  document.getElementById('k-spent').textContent=usdAbs(spent);
  document.getElementById('k-income').textContent=usdAbs(income);
  var ne=document.getElementById('k-net');ne.textContent=(net>=0?'+':'')+usdAbs(net);ne.className='val '+(net>=0?'pos':'neg');
  document.getElementById('k-count').textContent=rows.length.toLocaleString();
  var months=Array.from(new Set(rows.map(function(r){return r.date.slice(0,7);}))).sort();
  document.getElementById('period-label').textContent=months.length?' · '+months[0]+' → '+months[months.length-1]:'';
}
function renderBar(rows){
  var mNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var map={};
  rows.forEach(function(r){
    var m=(r.date||'').slice(0,7);
    if(!m||m.length<7)return;
    if(!map[m])map[m]={inc:0,exp:0};
    if(r.amount>0)map[m].inc+=r.amount;else map[m].exp+=(-r.amount);
  });
  var months=Object.keys(map).sort().slice(-12);
  var ctx=document.getElementById('barChart');
  if(barInst)barInst.destroy();
  var dispMonths=months.map(function(m){var p=m.split('-');return mNames[parseInt(p[1],10)-1]+' '+p[0];});
  barInst=new Chart(ctx,{type:'bar',data:{labels:dispMonths,datasets:[
    {label:'Income',data:months.map(function(m){return map[m].inc;}),backgroundColor:'#22c55e60',borderColor:'#15803d',borderWidth:1.5,borderRadius:3},
    {label:'Expense',data:months.map(function(m){return map[m].exp;}),backgroundColor:'#f87171a0',borderColor:'#dc2626',borderWidth:1.5,borderRadius:3}
  ]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:12}}},scales:{x:{ticks:{font:{size:10}}},y:{ticks:{callback:function(v){return'$'+(v/1000).toFixed(0)+'k';}}}}}});
}
function renderDonut(rows){
  var spent=rows.filter(function(r){return r.amount<0;});
  var total=spent.reduce(function(s,r){return s+(-r.amount);},0);
  var map={};spent.forEach(function(r){map[r.category]=(map[r.category]||0)+(-r.amount);});
  var entries=Object.entries(map).sort(function(a,b){return b[1]-a[1];});
  var labels=entries.map(function(e){return e[0];});
  var cols=labels.map(function(_,i){return COLORS[i%COLORS.length];});
  document.getElementById('donut-total').textContent=usdK(total);
  var ctx=document.getElementById('donut');
  if(donutInst)donutInst.destroy();
  donutInst=new Chart(ctx,{type:'doughnut',data:{labels:labels,datasets:[{data:entries.map(function(e){return e[1];}),backgroundColor:cols,borderWidth:2,borderColor:'#fff',cutout:'70%'}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return c.label+': '+usdAbs(c.parsed)+' ('+Math.round(c.parsed/total*100)+'%)';}}}},
      onClick:function(e,els){if(els.length){var cat=labels[els[0].index];STATE.catFilter=(STATE.catFilter===cat?null:cat);render();}}}});
  var leg=document.getElementById('legend');
  leg.innerHTML=entries.map(function(e,i){
    var pct=total?Math.round(e[1]/total*100):0;
    var on=STATE.catFilter===e[0]?'style="background:var(--bg)"':'';
    var ce=esc(e[0]);
    return'<div class="lrow" '+on+' onclick="toggleCat(\''+ce.replace(/'/g,"\\'")+'\')"><span class="sw" style="background:'+COLORS[i%COLORS.length]+'"></span><span class="nm">'+ce+'</span><span class="amt">'+usdAbs(e[1])+'</span><span class="pct">'+pct+'%</span><span class="edit-hint" onclick="event.stopPropagation();editLegendCat(this,\''+ce.replace(/'/g,"\\'")+'\')">✏</span></div>';
  }).join('');
}
function getAccountType(nm){
  var n=nm||'';
  if(/card|mastercard|sapphire|bonvoy|aadvantage|ritz[- ]carlton/i.test(n))return'credit';
  if(/\(9613\)|\(6852\)|\(9575\)|\(5150\)|\(8619\)|\(8238\)|\(1539\)|\(4005\)|\(1009\)|\(3292\)|\(3000\)/.test(n))return'credit';
  if(/\(620\)|\(3030\)|\(1950\)|\(7447\)|\(0146\)|\(6469\)|\(9225\)|brokerage|individual\.\.\.|managed/i.test(n))return'brokerage';
  return'bank';
}
function renderTypeSplit(accts){
  var banks=accts.filter(function(a){return getAccountType(a)==='bank';}).sort(function(a,b){return lbl(a).localeCompare(lbl(b));});
  var credits=accts.filter(function(a){return getAccountType(a)==='credit';}).sort(function(a,b){return lbl(a).localeCompare(lbl(b));});
  var brokers=accts.filter(function(a){return getAccountType(a)==='brokerage';}).sort(function(a,b){return lbl(a).localeCompare(lbl(b));});
  function card(nm){
    var bal=LIVE_BAL[nm]?LIVE_BAL[nm].balance:null;
    var rows=ALL.filter(function(r){return r.account===nm;});
    var net=rows.reduce(function(s,r){return s+r.amount;},0);
    var t=getAccountType(nm);
    var cls='acct'+(t==='bank'?' bank-acct':t==='credit'?' credit-acct':' brokerage-acct');
    return'<div class="'+cls+'"><div class="nm" title="'+esc(nm)+'">'+esc(lbl(nm))+'</div>'
      +'<div class="meta">'+(LIVE_BAL[nm]?LIVE_BAL[nm].institution:'')+'</div>'
      +(bal!==null?'<div class="bal" style="color:'+(bal>=0?'var(--pos)':'var(--neg)')+'">'+usdAbs(bal)+' balance</div>':'')
      +'<div style="font-size:11px;color:var(--muted);margin-top:2px">'+(net>=0?'+':'')+usdAbs(net)+' net · '+rows.length+' txns</div></div>';
  }
  var html='';
  if(banks.length){html+='<div class="acct-type-label">🏦 Bank Accounts</div><div class="acct-grid">';banks.forEach(function(nm){html+=card(nm);});html+='</div>';}
  if(credits.length){html+='<div class="acct-type-label">💳 Credit Cards</div><div class="acct-grid">';credits.forEach(function(nm){html+=card(nm);});html+='</div>';}
  if(brokers.length){html+='<div class="acct-type-label">📈 Brokerage & Savings</div><div class="acct-grid">';brokers.forEach(function(nm){html+=card(nm);});html+='</div>';}
  return html;
}
function renderAccounts(){
  var content=document.getElementById('acct-content');if(!content)return;
  var ACCT_GROUPS={'Perseverance':['8808'],'PayDiverse/Elm':['3000','9613','1360','1378','3292'],'Celestra/Fortuna':['1007','6576','6852','6860'],'Frank Personal':['8238','6469','9575','0928','5917','5150','8619','1539','4005','1009','9225','566','728','3988','3438','3439','9785','340','707']};
  function getGroup(nm){var n=nm.toLowerCase();for(var g in ACCT_GROUPS){var keys=ACCT_GROUPS[g];for(var i=0;i<keys.length;i++){if(n.indexOf('('+keys[i]+')')!==-1)return g;}}return"Rob's Personal";}
  var groups={"Rob's Personal":[],'Perseverance':[],'PayDiverse/Elm':[],'Celestra/Fortuna':[],'Frank Personal':[]};
  var names=Object.keys(LIVE_BAL);if(!names.length)names=Object.keys((function(){var m={};ALL.forEach(function(r){m[r.account]=1;});return m;})());
  names.forEach(function(nm){var g=getGroup(nm);if(!groups[g])groups[g]=[];groups[g].push(nm);});
  var html='',gi=0;
  Object.entries(groups).forEach(function(e){var grp=e[0],accts=e[1];if(!accts.length)return;var gid='acct-g-'+(gi++);html+='<div class="acct-group-label" onclick="toggleAG(this)" data-gid="'+gid+'">'+esc(grp)+'<span>&#9654;</span></div><div id="'+gid+'" style="display:none">'+renderTypeSplit(accts)+'</div>';});
  content.innerHTML=html||'<div style="color:var(--muted);text-align:center;padding:32px">Sync to load account data.</div>';
  var sel=document.getElementById('acct-filter');var cur=sel.value;
  sel.innerHTML='<option value="">All accounts</option>';
  names.sort().forEach(function(nm){sel.insertAdjacentHTML('beforeend','<option value="'+esc(nm)+'"'+(nm===cur?' selected':'')+'>'+esc(lbl(nm))+'</option>');});
}
var FILTERS={};
var _cfd_col=null;
function toast(msg,err){
  var t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:20px;right:20px;background:'+(err?'#dc2626':'#15803d')+';color:#fff;padding:8px 14px;border-radius:6px;font-size:12px;z-index:99999;opacity:1;transition:opacity 1s';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){t.style.opacity='0';setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},1000);},2500);
}

function colVal(r,c){return c==='account'?lbl(r.account):c==='description'?(r.description||r.payee||''):c==='category'?(r.category||''):c==='date'?(r.date||'').slice(0,7):r.amount>=0?'Income':'Expense';}
function openCF(col,th){
  var d=document.getElementById('cfd');
  if(_cfd_col===col&&d.style.display!=='none'){d.style.display='none';_cfd_col=null;return;}
  _cfd_col=col;
  var vals=[];
  ALL.forEach(function(r){var v=colVal(r,col);if(v&&vals.indexOf(v)<0)vals.push(v);});
  vals.sort();
  var h='<input class="cfd-search" placeholder="Type to search..." oninput="filterCFD(this)">';
  h+='<div class="cfi cfi-all" data-col="'+esc(col)+'"><em>— Show all —</em></div>';
  vals.forEach(function(v){
    var s=FILTERS[col]===v;
    h+='<div class="cfi'+(s?' cfi-sel':'')+'" data-col="'+esc(col)+'" data-val="'+esc(v)+'">'+esc(v)+'</div>';
  });
  d.innerHTML=h;
  setTimeout(function(){var inp=d.querySelector('.cfd-search');if(inp)inp.focus();},30);
  d.onclick=function(e){
    var item=e.target.closest?e.target.closest('.cfi'):e.target;
    if(!item||!item.classList||!item.classList.contains('cfi'))return;
    var c=item.getAttribute('data-col');
    var v=item.classList.contains('cfi-all')?null:item.getAttribute('data-val');
    setCF(c,v);
  };
  var r=th.getBoundingClientRect();
  d.style.left=r.left+'px';
  d.style.top=(r.bottom+2)+'px';
  d.style.display='block';
}
function setCF(col,val){
  if(val===null)delete FILTERS[col];else FILTERS[col]=val;
  var d=document.getElementById('cfd');if(d)d.style.display='none';_cfd_col=null;
  STATE.page=1;render();
}
function filterCFD(inp){
  var q=(inp.value||'').toLowerCase();
  var items=inp.parentNode.querySelectorAll('.cfi');
  for(var i=0;i<items.length;i++){
    var txt=(items[i].textContent||'').toLowerCase();
    items[i].style.display=(!q||txt.indexOf(q)>=0)?'':'none';
  }
}

function editDesc(ev,td){
  ev.stopPropagation();
  if(td.querySelector('input'))return;
  var cur=td.getAttribute('data-desc')||'';
  var id=td.getAttribute('data-id')||'';
  var inp=document.createElement('input');
  inp.className='desc-input';inp.value=cur;inp.title='Enter to save all matching, Esc to cancel';
  td.innerHTML='';td.appendChild(inp);
  inp.onclick=function(e){e.stopPropagation();};
  inp.onblur=function(){td.innerHTML=esc(cur)+'<span class="edit-hint">✏</span>';td.setAttribute('data-desc',cur);};
  inp.onkeydown=function(e){
    if(e.key==='Escape'){inp.blur();return;}
    if(e.key==='Enter'){
      e.preventDefault();
      var nd=inp.value.trim();
      if(!nd||nd===cur){inp.blur();return;}
      td.innerHTML=esc(nd)+'<span class="edit-hint">✏</span>';
      td.setAttribute('data-desc',nd);
      ALL.forEach(function(r){if((r.description||r.payee||'')===cur){r.description=nd;}});
      google.script.run.withFailureHandler(function(){}).renameDesc(cur,nd);
      render();
    }
  };
  inp.focus();inp.select();
}

function renderTx(){
  var rows=filtered();
  var ds=document.getElementById('d-start').value,de=document.getElementById('d-end').value;
  var q=(document.getElementById('tx-search').value||'').toLowerCase();
  var ta=document.getElementById('tx-acct-filter');var taVal=ta?ta.value:'';
  if(ds)rows=rows.filter(function(r){return r.date>=ds;});
  if(de)rows=rows.filter(function(r){return r.date<=de;});
  if(taVal)rows=rows.filter(function(r){return r.account===taVal;});
  if(q)rows=rows.filter(function(r){return(r.description+r.payee+lbl(r.account)+r.category).toLowerCase().includes(q);});
  // Populate account filter dropdown
  if(ta&&ta.options.length<=1&&ALL.length>0){
    var names=Array.from(new Set(ALL.map(function(r){return r.account;}))).sort();
    names.forEach(function(nm){var o=document.createElement('option');o.value=nm;o.textContent=lbl(nm);ta.appendChild(o);});
  }
  ['date','account','description','category','amount'].forEach(function(c){var el=document.getElementById('sort-'+c);if(el)el.textContent=SORT.col===c?(SORT.dir===1?'\u25b2':'\u25bc'):'';});
  if(SORT.col){rows=rows.slice().sort(function(a,b){var av,bv;if(SORT.col==='date'){av=a.date;bv=b.date;}else if(SORT.col==='account'){av=lbl(a.account).toLowerCase();bv=lbl(b.account).toLowerCase();}else if(SORT.col==='description'){av=(a.description||a.payee||'').toLowerCase();bv=(b.description||b.payee||'').toLowerCase();}else if(SORT.col==='category'){av=(a.category||'').toLowerCase();bv=(b.category||'').toLowerCase();}else{av=a.amount;bv=b.amount;}if(av<bv)return -SORT.dir;if(av>bv)return SORT.dir;return 0;});}
  var _fks=Object.keys(FILTERS||{});for(var _fi=0;_fi<_fks.length;_fi++){var _fc=_fks[_fi];if(FILTERS[_fc]){var _fv=FILTERS[_fc];rows=rows.filter(function(r){return colVal(r,_fc)===_fv;});}}
  document.getElementById('tx-count').textContent=rows.length.toLocaleString()+' transactions';
  var total=rows.length,pages=Math.max(1,Math.ceil(total/PAGE));
  if(STATE.page>pages)STATE.page=1;
  document.getElementById('tx-body').innerHTML=rows.slice((STATE.page-1)*PAGE,STATE.page*PAGE).map(function(r){
    var cls=r.amount<0?'amt-neg':'amt-pos';
    return'<tr><td>'+r.date+'</td><td title="'+esc(r.account)+'">'+esc(lbl(r.account))+'</td><td class="desc-cell" data-id="'+esc(r.id)+'" data-desc="'+esc(r.description||r.payee||'')+'" onclick="editDesc(event,this)">'+esc(r.description||r.payee||'')+'<span class="edit-hint">✏</span></td>'
      +'<td class="cat-cell" data-id="'+esc(r.id)+'" data-cat="'+esc(r.category)+'" data-date="'+esc(r.date||'')+'" data-account="'+esc(r.account||'')+'" data-amount="'+Number(r.amount||0)+'" onclick="editCat(event,this)"><span class="tag">'+esc(r.category)+'</span><span class="edit-hint">✏</span></td>'
      +'<td class="right '+cls+'">'+usdAbs(r.amount)+'</td></tr>';
  }).join('');
  document.getElementById('pager').innerHTML='<button '+(STATE.page<=1?'disabled':'')+' onclick="STATE.page--;renderTx()">‹ Prev</button><span>Page '+STATE.page+' of '+pages+' ('+total.toLocaleString()+')</span><button '+(STATE.page>=pages?'disabled':'')+' onclick="STATE.page++;renderTx()">Next ›</button>';
}
function sortBy(col){if(SORT.col===col){SORT.dir*=-1;}else{SORT.col=col;SORT.dir=1;}STATE.page=1;renderTx();}

function editCat(ev,td){
  ev.stopPropagation();if(td.querySelector('select'))return;
  var cur=td.getAttribute('data-cat')||'',id=td.getAttribute('data-id')||'';
  var rDate=td.getAttribute('data-date')||'',rAcct=td.getAttribute('data-account')||'',rAmt=td.getAttribute('data-amount')||'';
  var cKey=rDate+'|'+rAcct+'|'+rAmt;
  var sel=document.createElement('select');sel.className='cat-select';
  ALL_CATS.forEach(function(c){var o=document.createElement('option');o.value=c;o.textContent=c;if(c===cur)o.selected=true;sel.appendChild(o);});
  td.innerHTML='';td.appendChild(sel);
  sel.onclick=function(e){e.stopPropagation();};
  sel.onchange=function(){
    var nc=sel.value;
    td.innerHTML='<span class="tag">'+esc(nc)+'</span><span class="edit-hint">✏</span>';
    td.setAttribute('data-cat',nc);
    var row=ALL.find(function(r){return(r.id&&r.id===id)||(r.date+'|'+r.account+'|'+r.amount===cKey);});if(row)row.category=nc;
    var catMap=JSON.parse(localStorage.getItem('catMap')||'{}');catMap[cKey]=nc;localStorage.setItem('catMap',JSON.stringify(catMap));
    renderDonut(filtered());
    toast('Category saved');
    if(id)google.script.run.withSuccessHandler(function(){}).withFailureHandler(function(){}).updateCategory(id,nc);
  };
  sel.onblur=function(){
    if(!td.querySelector('select'))return;
    td.innerHTML='<span class="tag">'+esc(cur)+'</span><span class="edit-hint">✏</span>';
  };
  sel.focus();
}
function toggleAG(el){var gid=el.getAttribute('data-gid');var d=document.getElementById(gid);var ch=el.querySelector('span');if(!d)return;var open=d.style.display!=='none';d.style.display=open?'none':'block';if(ch)ch.textContent=open?'▶':'▼';}
function toggleCat(c){STATE.catFilter=(STATE.catFilter===c?null:c);render();}
function editLegendCat(el,oldCat){
  var lrow=el.parentElement;if(lrow.querySelector('input'))return;
  var nm=lrow.querySelector('.nm');
  var inp=document.createElement('input');inp.type='text';inp.value=oldCat;inp.style.cssText='font-size:11px;border:1px solid var(--accent);border-radius:4px;padding:2px 5px;width:120px;background:var(--panel);color:var(--ink)';
  inp.onclick=function(e){e.stopPropagation();};
  inp.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();doRename(inp.value.trim(),oldCat);}if(e.key==='Escape')render();};
  inp.onblur=function(){doRename(inp.value.trim(),oldCat);};
  nm.replaceWith(inp);inp.select();
}
function doRename(newCat,oldCat){if(!newCat||newCat===oldCat){render();return;}ALL.forEach(function(r){if(r.category===oldCat)r.category=newCat;});google.script.run.renameCategory(oldCat,newCat);render();}
function addCat(){var inp=document.getElementById('new-cat');var name=(inp.value||'').trim();if(!name)return;if(ALL_CATS.indexOf(name)===-1){ALL_CATS.push(name);ALL_CATS.sort();CUSTOM_CATS.push(name);localStorage.setItem('expCats',JSON.stringify(CUSTOM_CATS));}inp.value='';inp.placeholder='✓ "'+name+'" added';setTimeout(function(){inp.placeholder='+ New category…';},2000);}
function showView(id,el){document.querySelectorAll('#overview,#accounts').forEach(function(d){d.classList.remove('active');});document.getElementById(id).classList.add('active');document.querySelectorAll('.nav a').forEach(function(a){a.classList.remove('active');});if(el)el.classList.add('active');}
function setPeriod(days,btn){STATE.period=days;STATE.page=1;document.querySelectorAll('#period-btns .tgl').forEach(function(b){b.classList.remove('on');});if(btn)btn.classList.add('on');render();}
function doSync(){
  var btn=document.getElementById('sync-btn'),status=document.getElementById('sync-status');
  btn.disabled=true;btn.innerHTML='<span class="sync-spin">🔄</span> Syncing…';status.textContent='';
  google.script.run.withSuccessHandler(function(r){var d=new Date(r.syncedAt);var label='✓ Synced '+d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' at '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});status.textContent=label;status.style.color='var(--pos)';localStorage.setItem('lastSync',label);loadData();}).withFailureHandler(function(e){status.textContent='✗ '+e.message;status.style.color='var(--neg)';btn.disabled=false;btn.innerHTML='🔄 Sync';}).syncNow();
}
function loadData(){
  var btn=document.getElementById('sync-btn');
  var token='<?= userToken ?>';
  google.script.run.withSuccessHandler(function(data){ALL=data.rows||[];LIVE_BAL=data.accounts||{};var catMap=JSON.parse(localStorage.getItem('catMap')||'{}');ALL.forEach(function(r){if(r.category==='Payroll & Income'){r.category=r.amount<0?'Payroll':'Income';}var cKey=(r.date||'')+'|'+(r.account||'')+'|'+r.amount;if(catMap[cKey])r.category=catMap[cKey];});document.getElementById('loading').style.display='none';document.getElementById('overview').classList.add('active');render();btn.disabled=false;btn.innerHTML='🔄 Sync';}).withFailureHandler(function(e){document.getElementById('loading').textContent='Error: '+e.message;btn.disabled=false;btn.innerHTML='🔄 Sync';}).getData(token||null);
}
(function(){
  var saved=localStorage.getItem('lastSync');if(saved){var s=document.getElementById('sync-status');s.textContent=saved;s.style.color='var(--pos)';}
  loadData();
  google.script.run.withSuccessHandler(function(url){var el=document.getElementById('sheet-link');el.href=url;el.style.display='';}).getSheetUrl();
})();
</script>
</div>
</body>
